    costo_clp: 0
    mensaje_marketing: "Envío gratis a todo Chile"
    cobertura_nacional: "Se realizan envíos a todo Chile."
    cobertura_internacional: >
      También se realizan envíos al extranjero. Solicita país y ciudad y deriva al
      equipo para confirmar costo, plazo y forma de pago. El envío gratis y el pago
      contraentrega solo se informan para Chile, salvo confirmación humana distinta.
    plazo_santiago: "1 a 3 días"
    plazo_regiones: "3 a 5 días"
    fuente_plazos: "Confirmados por la propietaria a partir de su atención comercial."
    regla_plazo: "Es un plazo publicado, no una garantía. No dice si son días hábiles."
    regiones_disponibles_en_formulario:
      - Coquimbo
      - Valparaíso
      - Santiago / Región Metropolitana
      - O’Higgins
      - Maule
      - Ñuble
      - Biobío
      - Araucanía
      - Los Ríos
      - Los Lagos
    regiones_no_disponibles_en_formulario_web:
      - Arica y Parinacota
      - Tarapacá
      - Antofagasta
      - Atacama
      - Aysén
      - Magallanes
    regla_cobertura: >
      Los envíos cubren todo Chile. Si la región del cliente no aparece en el
      formulario web, no niegues la cobertura: ofrece ingreso asistido y deriva al
      contacto humano. Para el extranjero solicita país y ciudad antes de confirmar
      costo, plazo o forma de pago.
  pedido:
    integracion_publicada: >
      Cada página de producto abre un formulario Releasit COD que crea el pedido
      en Shopify. El formulario no guarda el pedido como borrador.
    ruta_preferida: >
      Informar primero precio, envío gratis y pago al recibir; conversar y responder
      dudas; cuando exista intención explícita de compra, enviar la URL oficial para
      completar el formulario seguro "PAGA Contra ENTREGA". Si requiere ayuda, una
      persona del equipo continúa por el mismo chat y hace el cierre.
    datos_obligatorios_formulario:
      - nombre
      - apellido
      - WhatsApp
      - dirección
      - referencia de dirección
      - región
      - ciudad o comuna
    datos_opcionales_formulario:
      - código postal
      - correo electrónico
      - nota del pedido
    datos_no_solicitar_por_chat:
      - contraseña
      - datos de tarjeta
      - claves bancarias
      - fotografías de documentos
    regla_chat: >
      Si el cliente no puede usar el formulario o pide comprar por chat, deriva a
      una persona del equipo por el mismo chat para el cierre e ingreso manual. No
      repitas el número de WhatsApp ni afirmes que el pedido fue creado mientras no
      exista confirmación del sistema.

