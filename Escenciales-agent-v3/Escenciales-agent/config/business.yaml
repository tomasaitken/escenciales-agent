  metodo_pago:
    nombre: "Pago contraentrega / pago al recibir"
    estado_publicado: true
    aplicacion_shopify: "Releasit COD Form"
    tarifa_contraentrega: 0
    explicacion: >
      El formulario publicado indica que el cliente recibe primero y paga al momento
      de la entrega. No pide pago anticipado dentro del flujo contraentrega.
  despacho:
    gestion_backend_declarada_por_propietario: "Dropi"
    transportista_publicado: "Blue Express / Copec"
    costo_clp: 0
    mensaje_marketing: "Envío gratis a todo Chile"
    plazo_santiago: "1 a 3 días"
    plazo_regiones: "2 a 5 días"
    regla_plazo: "Es un plazo publicado, no una garantía. No dice si son días hábiles."
    regiones_disponibles_en_formulario:
      - Coquimbo
      - Valparaíso
      - Santiago / Región Metropolitana
      - O’Higgins
      - Maule
      - Ñuble
      - Biobío
      - Araucanía
      - Los Ríos
      - Los Lagos
    regiones_excluidas_en_configuracion_formulario:
      - Arica y Parinacota
      - Tarapacá
      - Antofagasta
      - Atacama
      - Aysén
      - Magallanes
    regla_cobertura: >
      Existe una contradicción entre "todo Chile" y las regiones eliminadas del
      formulario. Antes de prometer despacho pregunta la región. Si está excluida,
      explica que el formulario no la muestra y deriva al contacto humano.
  pedido:
    integracion_publicada: >
      Cada página de producto abre un formulario Releasit COD que crea el pedido
      en Shopify. El formulario no guarda el pedido como borrador.
    ruta_preferida: >
      Confirmar producto, cantidad y región; luego enviar la URL oficial del producto
      para que el cliente complete el formulario seguro "PAGA Contra ENTREGA".
    datos_obligatorios_formulario:
      - nombre
      - apellido
      - WhatsApp
      - dirección
      - referencia de dirección
      - región
      - ciudad o comuna
    datos_opcionales_formulario:
      - código postal
      - correo electrónico
      - nota del pedido
    datos_no_solicitar_por_chat:
      - contraseña
      - datos de tarjeta
      - claves bancarias
      - fotografías de documentos
    regla_chat: >
      Si el cliente no puede usar el formulario y pide comprar por chat, recopila
      solo los campos obligatorios, resume y deriva para ingreso manual. Nunca
      afirmes que el pedido fue creado mientras no exista confirmación del sistema.

